name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-scientific-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate, test, and reconstruct from the flat artifact root
        shell: bash
        run: |
          mkdir -p .scientific-output
          timeout --signal=TERM --kill-after=15s 600s bash -euo pipefail -c '
            ulimit -t 560
            ulimit -v 4194304
            python -B --version
            node --version
            python -B run_all.py --out .scientific-output/results 2>&1 | tee .scientific-output/regeneration.log
            export COVEWM_RESULTS="$PWD/.scientific-output/results"
            python -B -m unittest discover -s tests -p "test*.py" -v 2>&1 | tee .scientific-output/tests.log
            python -B recheck.py --results .scientific-output/results 2>&1 | tee .scientific-output/reconstruction.log
          ' 2>&1 | tee .scientific-output/whole-run.log
      - name: Retain raw output even when a scientific gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-output
          path: .scientific-output/
          include-hidden-files: true
          if-no-files-found: warn
